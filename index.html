<style>:root{
  --dark:#0b3d2e;--pri:#17785c;--teal:#1f8a70;--gold:#f4b41a;--red:#c0392b;--amber:#b7791f;--purple:#6c4ab6;--blue:#4f7cc4;
  --ink:#1d2b26;--muted:#5d6d66;--line:#dfe8e3;--bg:#f3f6f4;--card:#ffffff;--soft:#eef6f2;--inp:#fff8e1;
  --sA:#d3efe2;--sB:#fce7be;--sC:#dbe7f8;--radius:12px;--shadow:0 1px 2px rgba(11,61,46,.06),0 4px 16px rgba(11,61,46,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri)}
#app{display:flex;min-height:100vh}
/* sidebar */
#side{width:236px;flex:0 0 236px;background:linear-gradient(180deg,var(--dark),#0f4c3a);color:#e8f3ee;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:16px 14px 12px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand img{width:44px;height:44px;border-radius:50%;background:#fff}
.brand b{display:block;font-size:14px;letter-spacing:.3px}
.brand small{color:#9fc7b6;font-size:11px}
.nav{padding:8px 8px 16px}
.nav h6{margin:14px 10px 6px;font-size:10.5px;letter-spacing:1.2px;color:#8fbca9;font-weight:700;text-transform:uppercase}
.nav button{display:flex;width:100%;align-items:center;gap:10px;border:0;background:transparent;color:#e3efe9;padding:8px 10px;border-radius:9px;cursor:pointer;text-align:left;font-size:13.5px}
.nav button:hover{background:rgba(255,255,255,.07)}
.nav button.on{background:var(--gold);color:var(--dark);font-weight:700}
.nav .ic{width:20px;text-align:center}
.nav .badge{margin-left:auto;background:var(--red);color:#fff;border-radius:10px;padding:0 7px;font-size:11px;font-weight:700}
.side-foot{margin-top:auto;padding:12px 14px;font-size:11px;color:#8fbca9;border-top:1px solid rgba(255,255,255,.08)}
/* main */
#main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:14px 24px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top h1{font-size:18px;margin:0}
.top .sub{color:var(--muted);font-size:12.5px}
.top .sp{flex:1}
.status{padding:6px 12px;border-radius:999px;font-weight:700;font-size:12.5px}
.status.ok{background:#dff3e8;color:#11663f}.status.bad{background:#fbe1de;color:var(--red)}
#view{padding:22px 24px 60px;max-width:1400px;width:100%}
.btn{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:#b9cbc2}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--dark)}
.btn.red{background:#fff;border-color:#f0c4bf;color:var(--red)}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:7px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line);padding:16px 18px}
.card h3{margin:0 0 4px;font-size:15px}
.card .hint{color:var(--muted);font-size:12.5px;margin:0 0 12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow);border-top:4px solid var(--c,var(--pri))}
.kpi .l{font-size:11px;letter-spacing:.8px;font-weight:700;color:var(--muted);text-transform:uppercase}
.kpi .v{font-size:28px;font-weight:800;color:var(--c,var(--pri));line-height:1.2}
.kpi .s{font-size:12px;color:var(--muted)}
.checks{list-style:none;margin:0;padding:0}
.checks li{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line)}
.checks li:last-child{border:0}
.tick{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;flex:0 0 24px}
.tick.ok{background:#2e9e6e}.tick.bad{background:var(--red)}
.checks .go{margin-left:auto}
/* tables */
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff;max-height:68vh}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
table.t th{position:sticky;top:0;background:var(--pri);color:#fff;font-weight:600;text-align:left;padding:7px 8px;white-space:nowrap;z-index:1}
table.t td{border-bottom:1px solid var(--line);padding:3px 6px;vertical-align:middle}
table.t tr:nth-child(even) td{background:#fafcfb}
table.t td.num{text-align:center;color:var(--muted);width:40px}
table.t input,table.t select{width:100%;border:1px solid transparent;background:var(--inp);border-radius:6px;padding:5px 7px;min-width:50px}
table.t input:focus,table.t select:focus{outline:2px solid var(--gold);background:#fff}
table.t input.sm{max-width:70px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:#dff3e8;color:#11663f}.pill.bad{background:#fbe1de;color:var(--red)}.pill.info{background:#eef2f9;color:#33528a}
.pill.sp{background:#ece6f8;color:var(--purple)}.pill.mut{background:#f0f0f0;color:#888}
.form{display:grid;grid-template-columns:200px 1fr;gap:8px 14px;align-items:center}
.form label{font-weight:600;color:var(--muted);font-size:13px}
.form input,.form select{border:1px solid var(--line);background:var(--inp);border-radius:8px;padding:8px 10px;width:100%}
.form input:focus,.form select:focus{outline:2px solid var(--gold);background:#fff}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff}
.note{background:#fff8e1;border:1px solid #f3dfa4;border-radius:10px;padding:10px 12px;color:#6b5414;font-size:13px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.bar{height:8px;border-radius:4px;background:#e6ece9;overflow:hidden}.bar i{display:block;height:100%;background:var(--teal)}
/* seat chart on screen */
.chart{display:inline-block}
.chart table{border-collapse:separate;border-spacing:3px}
.chart td,.chart th{text-align:center}
.chart th.bench{font-size:10px;color:#fff;border-radius:4px;padding:2px 4px}
.chart th.rowh{font-size:11px;background:var(--pri);color:#fff;border-radius:4px;padding:3px 6px}
.chart td.seat{min-width:74px;height:34px;border-radius:6px;font-weight:700;font-size:13px;border:1px solid rgba(0,0,0,.06);cursor:pointer}
.chart td.seat:hover{outline:2px solid var(--gold)}
.chart td.sA{background:var(--sA)}.chart td.sB{background:var(--sB)}.chart td.sC{background:var(--sC)}
.chart td.vac{background:#f2f2f2;color:#aaa;font-weight:400}
.chart td.spc{background:#ece6f8;color:var(--purple);box-shadow:inset 0 0 0 2px var(--purple)}
.chart td.nop{background:#e7e7e7;color:#aaa;text-decoration:line-through;font-weight:400}
.chart td.gap{width:10px}
.chart td.sno{color:var(--muted);font-size:11px;width:26px}
.front{background:var(--dark);color:#fff;text-align:center;border-radius:6px;padding:5px;font-size:12px;font-weight:700;letter-spacing:1px}
/* modal */
#modal{position:fixed;inset:0;background:rgba(11,30,22,.45);display:none;align-items:center;justify-content:center;z-index:50}
#modal.on{display:flex}
#modal .box{background:#fff;border-radius:14px;max-width:640px;width:calc(100% - 32px);max-height:88vh;overflow:auto;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
#modal h3{margin-top:0}
#modal textarea{width:100%;min-height:200px;border:1px solid var(--line);border-radius:8px;padding:8px;font-family:Consolas,monospace;font-size:12px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:60}
#toast.on{opacity:1}
/* print centre */
.rep-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-bottom:16px}
.rep{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;cursor:pointer;text-align:left}
.rep b{display:block}.rep span{font-size:12px;color:var(--muted)}
.rep.on{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri) inset}
#preview{background:#cfd8d3;padding:18px;border-radius:12px;overflow:auto}
.page{background:#fff;margin:0 auto 18px;box-shadow:0 2px 10px rgba(0,0,0,.15);padding:9mm 9mm;width:210mm;min-height:297mm;position:relative}
.page.land{width:297mm;min-height:210mm}
/* printable content */
.ph{display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--pri);padding-bottom:5px;margin-bottom:6px}
.ph img{width:46px;height:46px}
.ph .t1{font-size:18px;font-weight:800;color:var(--dark);line-height:1.1}
.ph .t2{font-size:10px;color:var(--muted)}
.ph .t3{font-size:10.5px;font-weight:700;color:var(--pri)}
.ptitle{background:var(--gold);color:var(--dark);font-weight:800;text-align:center;padding:5px;border-radius:5px;font-size:15px;margin:4px 0}
.pinfo{background:var(--soft);color:var(--pri);font-weight:700;text-align:center;padding:4px;border-radius:5px;font-size:11px;margin-bottom:6px}
table.p{border-collapse:collapse;width:100%;font-size:11px}
table.p th{background:var(--pri);color:#fff;padding:4px 5px;border:1px solid #9fb9ad;font-weight:700}
table.p td{border:1px solid #b9c9c1;padding:3px 5px}
table.p td.c{text-align:center}
table.p.tight td{padding:1px 4px;font-size:10px;line-height:1.15}
table.p tr.grp td{border-top:2px solid var(--dark)}
.pchart{border-collapse:separate;border-spacing:2px;margin:0 auto}
.pchart td.seat{border:1px solid #9fb2a9;text-align:center;font-weight:800;font-size:12px;height:26px;min-width:58px;border-radius:3px}
.pchart th{font-size:9px;color:#fff;padding:2px;border-radius:3px}
.pchart td.sA{background:var(--sA)}.pchart td.sB{background:var(--sB)}.pchart td.sC{background:var(--sC)}
.pchart td.vac{background:#f3f3f3;color:#aaa}.pchart td.spc{background:#ece6f8;color:var(--purple)}
.pchart th.rowh{background:var(--pri)}.pchart td.sno{font-size:10px;color:#666;text-align:center}
.pchart td.nop{background:#e6e6e6;color:#aaa;text-decoration:line-through}
.sign{display:flex;justify-content:space-between;margin-top:22px;font-size:11px;font-weight:700}
.sign div{border-top:1px solid var(--ink);padding-top:3px;min-width:180px;text-align:center}
.labels{display:grid;grid-template-columns:repeat(3,1fr);gap:2.5mm}
.lab{border:1px dashed #8fa39a;height:30mm;display:flex;flex-direction:column;text-align:center;overflow:hidden}
.lab .h{background:var(--pri);color:#fff;font-size:8.5px;font-weight:700;padding:2px}
.lab .r{font-size:30px;font-weight:800;color:var(--dark);line-height:1.15;margin-top:2px}
.lab .n{font-size:11px;font-weight:700}
.lab .e{font-size:7.5px;color:var(--muted);margin-top:auto;padding-bottom:2px}
.slips{display:grid;grid-template-columns:repeat(2,1fr);gap:3mm}
.slip{border:1px dashed #8fa39a;height:49mm;padding:0;overflow:hidden}
.slip .h{background:var(--pri);color:#fff;font-weight:800;font-size:11px;text-align:center;padding:3px}
.slip .h2{text-align:center;font-size:9px;color:var(--muted);padding:1px}
.slip table{width:100%;font-size:11px;border-collapse:collapse}
.slip td{padding:2px 6px}.slip td:first-child{color:var(--muted);font-weight:700;width:30%;font-size:10px}
.pkts{display:grid;grid-template-columns:repeat(2,1fr);gap:4mm}
.pkt{border:1.5px solid var(--dark);height:62mm;overflow:hidden}
.pkt .h{background:var(--dark);color:#fff;font-size:9px;font-weight:700;text-align:center;padding:3px}
.pkt .big{font-size:17px;font-weight:800;text-align:center;padding:3px;color:var(--dark)}
.pkt table{width:100%;font-size:10.5px;border-collapse:collapse}
.pkt td{border-top:1px solid #ccd8d2;padding:3px 6px}.pkt td:first-child{color:var(--muted);font-weight:700;width:32%;font-size:9.5px}
.pfoot{position:absolute;bottom:4mm;left:9mm;right:9mm;display:flex;justify-content:space-between;font-size:8px;color:#888}
@media print{
  html,body{background:#fff;height:auto}
  #app,#main{display:block;min-height:0}
  #toast,#modal{display:none!important}
  #side,.top,#view>*:not(#printwrap),#printwrap>.noprint,.toolbar{display:none!important}
  #view{padding:0;max-width:none}
  #printwrap,#preview{display:block!important;padding:0;background:#fff;border-radius:0;overflow:visible}
  .page,.page.land{box-shadow:none;margin:0;width:auto;min-height:0;page-break-after:always;padding:0}
  .page:last-child{page-break-after:auto}
  .pfoot{position:static;margin-top:8px}
  #printwrap .page{break-inside:auto}
  table.p thead{display:table-header-group}
  table.p tr{break-inside:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
#menuBtn{display:none;border:0;background:transparent;font-size:24px;line-height:1;padding:4px 8px;cursor:pointer;color:var(--dark)}
#installBtn{display:none}
#scrim{display:none}
@media (max-width:860px){
  #menuBtn{display:block}
  #side{position:fixed;left:0;top:0;bottom:0;height:100%;z-index:40;transform:translateX(-105%);transition:transform .22s ease;box-shadow:4px 0 24px rgba(0,0,0,.25)}
  body.menu-open #side{transform:none}
  body.menu-open #scrim{display:block;position:fixed;inset:0;background:rgba(11,30,22,.4);z-index:35}
  .top{padding:10px 12px;gap:8px;flex-wrap:wrap}
  .top h1{font-size:16px}.top .sub{font-size:11px}
  .top .btn.sm .lbl{display:none}
  #view{padding:12px 12px 70px}
  .g2,.g3{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,1fr);gap:8px}
  .kpi .v{font-size:22px}
  .form{grid-template-columns:1fr;gap:4px}
  .form label{margin-top:6px}
  .card{padding:12px}
  .toolbar .btn{padding:7px 10px;font-size:13px}
  .tbl-wrap{max-height:none}
  table.t{font-size:12.5px;min-width:680px}
  table.t select{min-width:74px}
  .card table.t{min-width:0}
  .chart{max-width:100%;overflow-x:auto;display:block}
  #findRes table.t,.card .tbl-wrap table.t{min-width:560px}
  #modal .box{width:calc(100% - 16px);padding:16px;max-height:92vh}
  #preview{padding:8px}
  .page{transform-origin:top left}
  .rep-list{grid-template-columns:1fr 1fr}
  .chart td.seat{min-width:58px;height:30px;font-size:11.5px}
}
@media (max-width:420px){.status{font-size:11px;padding:4px 8px}.rep-list{grid-template-columns:1fr}}
@media (display-mode:standalone){.side-foot .web-only{display:none}}

#shText{width:100%;min-height:260px;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:14px;line-height:1.45}
table.t.daytbl input{min-width:96px}
table.t.daytbl input[type=date]{min-width:142px}
table.t.daytbl select{min-width:100px}
table.t.daytbl td:nth-child(5) input{min-width:150px}

  s.rooms.forEach(r=>{ if(!Array.isArray(r.fixed)) r.fixed=["","",""]; if(!Array.isArray(r.lines)) r.lines=[]; });
  s.days.forEach(x=>{ if(!x.subj) x.subj={}; if(x.sess!=="N") x.sess="M"; });
  s.classes.forEach(c=>{ if(c.sess!=="N") c.sess="M"; });
  s.students.forEach(x=>{ if(x.group===undefined) x.group=""; });
  s.teachers.forEach(t=>{ if(t.off===undefined) t.off=""; if(t.sess!=="M"&&t.sess!=="N") t.sess=""; });
  if(!s.meta) s.meta={lastBackup:""};
  if(s.examId===undefined) s.examId="";
  s.version=2;
  return s;
}
let saveTimer=null, lastSaved=null;
function saveState(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{ try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); lastSaved=new Date(); const el=document.getElementById("saved"); if(el) el.textContent="Saved "+lastSaved.toLocaleTimeString(); }catch(e){ toast("⚠ Could not save in this browser — use Data → Save backup"); } },250);
}

/* ---------- helpers ---------- */
const T = v => (v===undefined||v===null) ? "" : String(v).trim();
const num = v => { const n=Number(v); return isFinite(n)?n:NaN; };
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function fmtDate(iso,opt){ if(!iso) return ""; const d=new Date(iso+"T00:00:00"); if(isNaN(d)) return iso;
  return d.toLocaleDateString("en-GB",opt||{day:"2-digit",month:"short",year:"numeric"}); }
function dayName(iso,long){ if(!iso) return ""; const d=new Date(iso+"T00:00:00"); return isNaN(d)?"":d.toLocaleDateString("en-GB",{weekday:long?"long":"short"}); }
const groupsOn = () => (S.setup.groups||[]).length>0;
const isGroupGrade = g => groupsOn() && (S.setup.groupGrades||[]).includes(g);

/* ---------- room geometry ---------- */
function roomGeom(r){
  const lines=(r.lines||[]).map(Number).filter(x=>x>0);
  const R=lines.reduce((a,b)=>a+b,0), D=Number(r.depth)||0;
  const benchOf=[], posIn=[], sizeOf=[];
  let c=0; lines.forEach((sz,bi)=>{ for(let p=0;p<sz;p++){ benchOf[c]=bi; posIn[c]=p; sizeOf[c]=sz; c++; } });
  return {lines,R,D,benchOf,posIn,sizeOf};
}
function roomIssue(r){
  if(!T(r.no)) return "";
  const raw=(r.lines||[]);
  if(raw.some(x=>![1,2,3].includes(Number(x)))) return "Bench line must be 1, 2 or 3 seats";
  const g=roomGeom(r);
  if(g.R===0) return "Enter bench lines";
  if(g.R>16) return "Max 16 ROWs";
  if(!(g.D>=1&&g.D<=15)) return "Benches front→back must be 1–15";
  return "";
}

/* ======================= COMPUTE ======================= */
function compute(S){
  const st=S.setup, N=Math.min(3,Math.max(1,Number(st.streams)||3)), zig=st.pattern==="zigzag";
  const two=!!st.twoSessions;
  const P={N,zig,two,issues:{students:{},specials:{},rooms:{},absentees:{},changes:{},classes:{}},stuInfo:{}};
  const classes=S.classes.filter(c=>T(c.name));
  const clsIdx={}; classes.forEach((c,i)=>clsIdx[T(c.name)]=i);
  const appearing=classes.filter(c=>c.appearing);
  const gradeOf={}, sessOf={}; classes.forEach(c=>{ gradeOf[T(c.name)]=T(c.grade); sessOf[T(c.name)]=two&&c.sess==="N"?"N":"M"; });
  P.gradeOf=gradeOf; P.sessOf=sessOf; P.classOrder=clsIdx;
  // ---- students
  const seenKey={}, elig={};
  S.students.forEach((s,i)=>{
    const c=T(s.cls), r=num(s.roll);
    if(!c && T(s.roll)==="" && !T(s.name)) return;
    let msg="";
    if(clsIdx[c]===undefined) msg="⚠ Class not on Classes list";
    else if(!(Number.isInteger(r)&&r>0)) msg="⚠ Roll No. must be a whole number";
    else if(seenKey[c+"|"+r]!==undefined) msg="⚠ Duplicate roll number";
    else if(!classes[clsIdx[c]].appearing) msg="Class not appearing";
    else if(STATUS_OUT.includes(T(s.status))) msg="Not seated — "+T(s.status);
    if(clsIdx[c]!==undefined && Number.isInteger(r)) { if(seenKey[c+"|"+r]===undefined) seenKey[c+"|"+r]=i; }
    let grp=T(s.group); if(grp && !(isGroupGrade(gradeOf[c]) && (st.groups||[]).includes(grp))) grp="";
    if(!msg && isGroupGrade(gradeOf[c]) && !grp && T(s.group)) msg="";
    P.issues.students[i]=msg;
    if(!msg){ (elig[c]=elig[c]||[]).push({cls:c,roll:r,name:T(s.name),idx:i,group:grp}); }
  });
  appearing.forEach(c=>{ const n=T(c.name); if(!elig[n] || elig[n].length===0){ const k=Number(c.strength)||0; elig[n]=[]; for(let r=1;r<=k;r++) elig[n].push({cls:n,roll:r,name:"",idx:-1,group:""}); P.issues.classes[n]= k? "strength": "⚠ No students"; } else P.issues.classes[n]="list"; });
  Object.values(elig).forEach(a=>a.sort((x,y)=>x.roll-y.roll));
  const studentByKey={}; Object.values(elig).forEach(a=>a.forEach(s=>studentByKey[s.cls+"|"+s.roll]=s));
  P.studentByKey=studentByKey;
  P.totalAppearing=appearing.reduce((a,c)=>a+(elig[T(c.name)]||[]).length,0);
  // group warnings for XI/XII students without a group
  if(groupsOn()) S.students.forEach((s,i)=>{ const c=T(s.cls); if(P.issues.students[i]==="" && isGroupGrade(gradeOf[c])){ const g=T(s.group); if(!g) P.issues.students[i]="⚠ Choose group ("+st.groups.join(" / ")+")"; else if(!st.groups.includes(g)) P.issues.students[i]="⚠ Group not used"; } });

  // ---- sittings (date sheet rows) & papers
  P.days=S.days.map((d,i)=>({i,date:T(d.date),time:T(d.time),sess:two&&d.sess==="N"?"N":"M",subj:d.subj||{}})).filter(d=>d.date);
  const sitOf=di=>P.days.find(d=>d.i===di);
  P.sitOf=sitOf;
  P.sitLabel=(di,short)=>{ const d=S.days[di]; if(!d||!T(d.date)) return "Day "+(di+1);
    const ss=two?(" · "+SESS_NAME[d.sess==="N"?"N":"M"]):""; return short?`Day ${di+1} · ${fmtDate(d.date,{day:"2-digit",month:"short"})}${ss}`:`Day ${di+1} — ${dayName(d.date,true)}, ${fmtDate(d.date)}${ss}${T(d.time)?" — "+T(d.time):""}`; };
  // subject of a student on a sitting: "" = no paper; group column wins over the common grade column
  const paperOf=(di,stu)=>{ const d=sitOf(di); if(!d) return null; if(two && sessOf[stu.cls]!==d.sess) return null;
    const subj=d.subj; const any=Object.values(subj).some(v=>T(v)); if(!any) return "";
    const g=gradeOf[stu.cls]; const v=(stu.group&&T(subj[g+"|"+stu.group]))||T(subj[g]); return v?v:null; };
  P.paperOf=paperOf;
  P.hasPaperStu=(di,stu)=>paperOf(di,stu)!==null;
  P.hasPaper=(di,cls)=>(elig[cls]||[]).some(s=>paperOf(di,s)!==null);
  P.subjectOfStu=(di,stu)=>{ const v=paperOf(di,stu); return v||""; };
  P.subjectOf=(di,cls)=>{ const set=new Set(); (elig[cls]||[]).forEach(s=>{ const v=paperOf(di,s); if(v) set.add(v); }); return [...set].join(" / "); };

  // ---- rooms (validated once)
  const roomDefs=[];
  S.rooms.forEach((r,i)=>{ const iss=roomIssue(r); P.issues.rooms[i]=iss; if(T(r.no)&&r.use&&!iss) roomDefs.push({i,no:T(r.no),loc:T(r.loc),inv:T(r.inv),...roomGeom(r)}); });
  P.roomDefs=roomDefs;
  const roomDefByNo={}; roomDefs.forEach(r=>roomDefByNo[r.no]=r);
  // ---- specials (validated once)
  const specialKeys=new Set(), seatTaken=new Set(), specOk=[];
  S.specials.forEach((sp,i)=>{
    const c=T(sp.cls), r=num(sp.roll), key=c+"|"+r; let msg="";
    if(!c && !T(sp.roll)) { P.issues.specials[i]=""; return; }
    const stu=studentByKey[key], room=roomDefByNo[T(sp.room)], row=num(sp.row), seat=num(sp.seat);
    if(!stu || stu.idx<0) msg="⚠ Not on the student list / not appearing";
    else if(!room) msg="⚠ Room not in use";
    else if(!(row>=1&&row<=room.R&&seat>=1&&seat<=room.D)) msg="⚠ ROW / Seat outside the room";
    else if(specialKeys.has(key)) msg="⚠ Student listed twice";
    else if(seatTaken.has(room.no+"|"+row+"|"+seat)) msg="⚠ Seat already given";
    P.issues.specials[i]=msg||("✔ Room "+room.no+", ROW-"+row+", Seat "+seat);
    if(!msg){ specialKeys.add(key); seatTaken.add(room.no+"|"+row+"|"+seat); specOk.push({key,stu,room:room.no,c:row-1,d:seat-1,reason:T(sp.reason)}); }
  });
  // ---- room fixed overrides (validated once)
  const fixedOk={};
  S.rooms.forEach((r,i)=>{
    const fx=(r.fixed||[]).map(T); let msg=""; const used=fx.filter(x=>x);
    if(used.length){
      if(!(T(r.no)&&r.use)) msg="Room not in use";
      else if(new Set(used).size!==used.length) msg="⚠ Same class twice in this room";
      else if(fx.some((x,k)=>x&&(k>=N||clsIdx[x]===undefined||!classes[clsIdx[x]].appearing))) msg="⚠ Class not appearing / stream not used";
      else if(two && new Set(used.map(x=>sessOf[x])).size>1) msg="⚠ Morning and Noon classes mixed — they never sit together";
    }
    P.issues.rooms["fx"+i]=used.length?(msg||"✔ Fixed"):"";
    if(used.length&&!msg) fixedOk[i]=fx;
  });

  // ---- one seat plan for a set of students
  function seatPlan(include,key,label){
    const plan={key,label,rooms:[],unseated:[],seatByKey:{},streamClasses:[[],[],[]],streamStats:[]};
    const rooms=roomDefs.map(def=>{ const room={...def,grid:[],seats:[]};
      for(let c=0;c<def.R;c++){ room.grid[c]=[]; for(let d=0;d<def.D;d++){ const stream=zig?(c+d)%N:c%N;
        const seat={room,c,d,stream,cls:"",roll:"",name:"",group:"",special:false,fixed:false}; room.grid[c][d]=seat; room.seats.push(seat);} }
      return room; });
    plan.rooms=rooms; const byNo={}; rooms.forEach(r=>byNo[r.no]=r);
    const put=(seat,s,extra)=>Object.assign(seat,{cls:s.cls,roll:s.roll,name:s.name,group:s.group,stu:s},extra||{});
    specOk.forEach(o=>{ if(include(o.stu)) put(byNo[o.room].grid[o.c][o.d],o.stu,{special:true,reason:o.reason}); });
    const inc={}; appearing.forEach(c=>{ const n=T(c.name); inc[n]=(elig[n]||[]).filter(s=>include(s)); });
    const queue={}; Object.keys(inc).forEach(n=>{ queue[n]=inc[n].filter(s=>!specialKeys.has(s.cls+"|"+s.roll)); queue[n].ptr=0; });
    const take=n=>{ const q=queue[n]; if(!q||q.ptr>=q.length) return null; return q[q.ptr++]; };
    const colMajor=(room,k)=>{ const out=[]; for(let c=0;c<room.R;c++) for(let d=0;d<room.D;d++){ const s=room.grid[c][d]; if(s.stream===k&&!s.special) out.push(s);} return out; };
    rooms.forEach(room=>{ const fx=fixedOk[room.i]; if(!fx) return;
      fx.forEach((cn,k)=>{ if(!cn||k>=N||!(queue[cn]&&queue[cn].length)) return; room.fixedStream=room.fixedStream||{}; room.fixedStream[k]=cn;
        colMajor(room,k).forEach(seat=>{ seat.fixed=true; const s=take(cn); if(s) put(seat,s); }); }); });
    const autoSeats=[[],[],[]];
    rooms.forEach(room=>{ for(let k=0;k<N;k++){ if(room.fixedStream&&room.fixedStream[k]) continue; autoSeats[k].push(...colMajor(room,k)); } });
    const lists=[[],[],[]];
    if(st.mode==="manual"){
      const byS=[[],[],[]];
      appearing.forEach(c=>{ const n=T(c.name); const q=queue[n]; if(!q||q.ptr>=q.length) return; const k=LETTER.indexOf(T(c.stream));
        if(k<0||k>=N){ while(q.ptr<q.length) plan.unseated.push({...q[q.ptr++],why:"No stream set (manual mode)"}); P.issues.classes[n]="⚠ Set stream"; return; }
        byS[k].push({n,o:Number(c.order)||999,i:clsIdx[n]}); });
      byS.forEach((arr,k)=>{ arr.sort((a,b)=>a.o-b.o||a.i-b.i); arr.forEach(x=>{ const q=queue[x.n]; while(q.ptr<q.length) lists[k].push(q[q.ptr++]); plan.streamClasses[k].push(x.n); }); });
    } else {
      const G=[]; appearing.forEach(c=>{ const q=queue[T(c.name)]; if(q) while(q.ptr<q.length) G.push(q[q.ptr++]); });
      const Sz=autoSeats.slice(0,N).map(a=>a.length), tot=Sz.reduce((a,b)=>a+b,0);
      const off=[0]; let cum=0;
      // cut the class list into N streams. Score: 1) fewest rooms used  2) fewest grades shared by two streams  3) closest to an even split
      const ri=new Map(rooms.map((r,i)=>[r,i]));
      const roomsFor=cuts=>{ let mx=-1; for(let k=0;k<N;k++){ const n=cuts[k+1]-cuts[k]; if(n<=0) continue; if(n>Sz[k]) return Infinity; mx=Math.max(mx,ri.get(autoSeats[k][n-1].room)); } return mx+1; };
      const shared=cuts=>{ const where={}; let x=0; for(let k=0;k<N;k++) for(let i=cuts[k];i<cuts[k+1];i++){ const g=gradeOf[G[i].cls]||G[i].cls; (where[g]=where[g]||new Set()).add(k); } Object.values(where).forEach(v=>{ if(v.size>1) x+=v.size-1; }); return x; };
      const splitCls=cuts=>{ let x=0; for(let k=1;k<N;k++){ const c=cuts[k]; if(c>0&&c<G.length&&G[c].cls===G[c-1].cls) x++; } return x; };
      const ideal=[0]; for(let k=1;k<N;k++){ cum+=Sz[k-1]; ideal[k]=tot?Math.round(G.length*cum/tot):Math.round(G.length*k/N); }
      const cand=new Set([...ideal.slice(1)]); for(let i=1;i<G.length;i++) if(G[i].cls!==G[i-1].cls) cand.add(i);
      const C=[...cand].sort((x,y)=>x-y);
      let best=null, bestSc=Infinity;
      const tryCuts=cuts=>{ const full=[0,...cuts,G.length]; for(let k=0;k<N;k++) if(full[k+1]<full[k]) return;
        const rm=roomsFor(full); if(rm===Infinity) return;
        const sc=rm*1e7+shared(full)*1e4+splitCls(full)*1e3+cuts.reduce((a,c,k)=>a+Math.abs(c-ideal[k+1]),0)*0.01;
        if(sc<bestSc){ bestSc=sc; best=full; } };
      if(N===1) best=[0,G.length];
      else if(N===2) C.forEach(c=>tryCuts([c]));
      else C.forEach(c1=>C.forEach(c2=>{ if(c2>=c1) tryCuts([c1,c2]); }));
      if(!best){ best=[...ideal]; best[N]=G.length; }
      for(let k=1;k<N;k++) off[k]=best[k];
      off[N]=G.length;
      for(let k=0;k<N;k++){ lists[k]=G.slice(off[k],off[k+1]); const seen=[]; lists[k].forEach(s=>{ if(!seen.includes(s.cls)) seen.push(s.cls); }); plan.streamClasses[k]=seen; }
    }
    for(let k=0;k<N;k++){ const seats=autoSeats[k], list=lists[k];
      list.forEach((s,i)=>{ if(i<seats.length) put(seats[i],s); else plan.unseated.push({...s,why:"No seat left"}); });
      plan.streamStats.push({k,students:list.length,seats:seats.length}); }
    let seated=0, cap=0, sameBench=0, aisle=0, sameGrade=0, frontBack=0;
    rooms.forEach(room=>{ cap+=room.seats.length; room.seats.forEach(s=>{ if(s.cls){ seated++; plan.seatByKey[s.cls+"|"+s.roll]=s; } }); room.seated=room.seats.filter(s=>s.cls).length;
      for(let d=0;d<room.D;d++) for(let c=0;c<room.R;c++){ const a=room.grid[c][d]; if(!a.cls) continue;
        for(let c2=c+1;c2<room.R&&room.benchOf[c2]===room.benchOf[c];c2++){ const b=room.grid[c2][d]; if(b.cls&&b.cls===a.cls){ sameBench++; a.bad=b.bad=true; } }
        if(c+1<room.R&&room.benchOf[c+1]!==room.benchOf[c]){ const b=room.grid[c+1][d]; if(b.cls&&b.cls===a.cls){ aisle++; a.bad=b.bad=true; } }
        if(c+1<room.R){ const b=room.grid[c+1][d]; if(b.cls&&b.cls!==a.cls&&gradeOf[b.cls]&&gradeOf[b.cls]===gradeOf[a.cls]) sameGrade++; }
        if(d+1<room.D){ const b=room.grid[c][d+1]; if(b.cls&&b.cls===a.cls) frontBack++; } }
      const by={}, order=[];
      for(let k=0;k<N+1;k++) for(let c=0;c<room.R;c++) for(let d=0;d<room.D;d++){ const s=room.grid[c][d]; if(!s.cls) continue; const sk=s.special?N:s.stream; if(sk!==k) continue;
        const kk=s.cls+(s.special?"★":""); if(!by[kk]){ by[kk]={cls:s.cls,rolls:[],special:s.special}; order.push(kk);} by[kk].rolls.push(s.roll); }
      room.segments=order.map(k=>{ const g=by[k]; g.rolls.sort((a,b)=>a-b); return {cls:g.cls,from:g.rolls[0],to:g.rolls[g.rolls.length-1],count:g.rolls.length,special:g.special,rolls:g.rolls}; });
    });
    plan.seated=seated; plan.capacity=cap; plan.used=rooms.filter(r=>r.seated);
    plan.checks={sameBench,aisle,sameGrade,frontBack};
    return plan;
  }

  // ---- which plans
  const sessions=two?["M","N"]:["M"];
  P.plans={}; P.planList=[];
  const daily=st.seatMode==="daily" && P.days.length>0;
  P.daily=daily;
  if(daily){
    P.days.forEach(d=>{ const k="D:"+d.i; P.plans[k]=seatPlan(s=>sessOf[s.cls]===d.sess&&paperOf(d.i,s)!==null,k,P.sitLabel(d.i,true)); P.planList.push(k); });
  } else {
    sessions.forEach(ss=>{ const k="S:"+ss; P.plans[k]=seatPlan(s=>sessOf[s.cls]===ss,k,two?SESS_NAME[ss]+" session":"Seat plan"); P.planList.push(k); });
  }
  P.planFor=di=>{ if(daily) return P.plans["D:"+di]; const d=sitOf(di); return P.plans["S:"+(d?d.sess:"M")]; };
  P.planForStu=s=>P.plans["S:"+sessOf[s.cls]];   // fixed mode
  P.firstPlan=P.plans[P.planList[0]];
  // ---- aggregates
  const unseenKey=new Set(); P.unseated=[];
  P.planList.forEach(k=>P.plans[k].unseated.forEach(u=>{ const kk=u.cls+"|"+u.roll; if(!unseenKey.has(kk)){ unseenKey.add(kk); P.unseated.push({...u,plan:P.plans[k].label}); } }));
  P.checks={sameBench:0,aisle:0,sameGrade:0,frontBack:0};
  P.planList.forEach(k=>{ const c=P.plans[k].checks; for(const x in c) P.checks[x]+=c[x]; });
  if(daily){ const seen=new Set(); P.planList.forEach(k=>Object.keys(P.plans[k].seatByKey).forEach(x=>seen.add(x))); P.seated=[...seen].filter(x=>!unseenKey.has(x)).length;
    P.capacity=P.firstPlan?P.firstPlan.capacity:0; }
  else { P.seated=P.planList.reduce((a,k)=>a+P.plans[k].seated,0); P.capacity=P.firstPlan?P.firstPlan.capacity:0; }
  P.roomsUsedMax=Math.max(0,...P.planList.map(k=>P.plans[k].used.length));
  // seat lookup: fixed → session plan; daily → first sitting with a seat
  P.seatOf=(key,di)=>{ if(di!==undefined&&di!==null){ const p=P.planFor(di); return p?p.seatByKey[key]:null; }
    for(const k of P.planList){ const s=P.plans[k].seatByKey[key]; if(s) return s; } return null; };
  P.seatsOf=key=>P.planList.map(k=>({plan:P.plans[k],seat:P.plans[k].seatByKey[key]})).filter(x=>x.seat);
  // student status
  S.students.forEach((s,i)=>{ if(P.issues.students[i]) return; const key=T(s.cls)+"|"+num(s.roll);
    if(unseenKey.has(key)) P.issues.students[i]="⚠ Not seated (no seat left)";
    else { const se=P.seatOf(key); if(!se) P.issues.students[i]=daily?"No paper in this exam":"⚠ Not seated"; else P.issues.students[i]=se.special?"★ Special seat":"✔ Seated"; } });
  // ---- absentees
  const absSet=new Set();
  S.absentees.forEach((a,i)=>{
    const dIdx=num(a.day)-1, key=T(a.cls)+"|"+num(a.roll); let msg="";
    if(!T(a.cls)&&!T(a.roll)){ P.issues.absentees[i]=""; return; }
    const stu=studentByKey[key];
    if(!stu) msg="⚠ Student not found / not appearing";
    else if(!sitOf(dIdx)) msg="⚠ Choose an exam day that has a date";
    else if(paperOf(dIdx,stu)===null) msg="⚠ No paper for this student that day";
    else if(!(P.planFor(dIdx)||{seatByKey:{}}).seatByKey[key]) msg="⚠ Student not seated";
    else if(absSet.has(dIdx+"|"+key)) msg="⚠ Entered twice";
    P.issues.absentees[i]=msg||"✔ Absent";
    if(!msg) absSet.add(dIdx+"|"+key);
  });
  P.isAbsent=(dayIdx,cls,roll)=>absSet.has(dayIdx+"|"+cls+"|"+roll);
  P.roomStudentsOnDay=(dayIdx,room)=>room.seats.filter(s=>s.cls&&paperOf(dayIdx,s.stu)!==null).length;
  invigilation(S,P);
  // ---- readiness
  const iss=P.issues, inv=P.inv;
  const bad=o=>Object.values(o).filter(v=>String(v).startsWith("⚠")).length;
  P.ready=[
    {t:"Every appearing student has a seat",ok:P.unseated.length===0,go:"rooms",d:P.unseated.length+" not seated"},
    {t:"Room layouts are valid",ok:Object.entries(iss.rooms).filter(([k,v])=>!k.startsWith("fx")&&v).length===0,go:"rooms"},
    {t:"Exam dates entered",ok:P.days.length>0,go:"days"},
    {t:"No two students of the same class on one bench",ok:P.checks.sameBench===0,go:"seatplan",d:P.checks.sameBench+" pairs"},
    {t:"No same class side by side across the aisle",ok:P.checks.aisle===0,go:"seatplan",d:P.checks.aisle+" pairs"},
    {t:"No two sections of the same grade side by side (advice)",ok:P.checks.sameGrade===0,soft:true,go:"seatplan",d:P.checks.sameGrade+" pairs — allowed, different sections"},
    {t:"Invigilators for every room, every sitting",ok:inv.unfilled===0&&P.days.length>0,go:"invig",d:inv.unfilled+" empty"},
    {t:two?"No teacher has two rooms the same day (or both sessions)":"No teacher has two rooms on the same day",ok:inv.clashes===0,go:"changes",d:inv.clashes+" clashes"},

/* ======================= INVIGILATION =======================
   Rules (hard, relaxed only if impossible — then counted on the Dashboard):
   • at most one room per teacher per DATE (so never both Morning and Noon)
   • Morning teachers only in Morning sittings, Noon teachers only in Noon ("Any" = either)
   • never the same room twice in one exam • never the same pair twice • not on "not available" days
   • duties shared evenly */
function invigilation(S,P){
  const st=S.setup, rnd=mulberry32((Number(st.shuffle)||1)*7919+13), two=P.two;
  const teachers=S.teachers.map((t,i)=>({i,name:T(t.name),short:T(t.short)||T(t.name).split(/\s+/).map(w=>w[0]).join("").slice(0,3).toUpperCase(),
    avail:t.avail!==false&&T(t.name)!=="",sess:two?(t.sess||""):"",off:new Set(String(t.off||"").split(/[^0-9]+/).filter(Boolean).map(Number))}));
  const avail=teachers.filter(t=>t.avail);
  const load=new Array(teachers.length).fill(0), roomsDone=teachers.map(()=>new Set()), pairs=new Set();
  const inv={teachers,days:[],unfilled:0,clashes:0,needTotal:0,filled:0,load,repeatRoom:0,repeatPair:0};
  const thr=Number(st.invThreshold)||50;
  const usedOnDate={};
  const order=S.days.map((d,i)=>i).sort((a,b)=>String(S.days[a].date).localeCompare(String(S.days[b].date))||(S.days[a].sess==="N")-(S.days[b].sess==="N")||a-b);
  const Ds=[];
  order.forEach(di=>{
    const day=S.days[di], sit=P.sitOf(di);
    const D={di,date:T(day.date),sess:sit?sit.sess:"M",rooms:{}};
    Ds[di]=D;
    if(!sit) return;
    const plan=P.planFor(di); const usedDate=usedOnDate[D.date]=usedOnDate[D.date]||new Set();
    const list=plan.rooms.map(r=>{ const n=P.roomStudentsOnDay(di,r); const key=r.inv==="1"?1:r.inv==="2"?2:(n>=thr?2:1); return {r,n,need:n?key:0,rand:rnd()}; });
    list.sort((a,b)=>b.need-a.need||a.rand-b.rand);
    const pool=avail.filter(t=>(!t.sess||t.sess===D.sess)&&!t.off.has(di+1));
    list.forEach(o=>{
      const slot={need:o.need,n:o.n,t:[null,null],changed:[false,false],rep:[false,false]}; D.rooms[o.r.no]=slot;
      for(let p=0;p<o.need;p++){
        const pk=t=>Math.min(slot.t[0],t.i)+"-"+Math.max(slot.t[0],t.i);
        const cands=pool.filter(t=>!usedDate.has(t.i));
        const pick=(ruleRoom,rulePair)=>{ let best=null,bs=Infinity;
          cands.forEach(t=>{ if(ruleRoom&&roomsDone[t.i].has(o.r.no)) return; if(rulePair&&p===1&&slot.t[0]!==null&&pairs.has(pk(t))) return;
            const sc=load[t.i]*1000+(two&&!t.sess?600:0)+rnd()*50; if(sc<bs){bs=sc;best=t;} }); return best; };
        let best=pick(true,true), rep=false;
        if(!best){ best=pick(true,false)||pick(false,true)||pick(false,false); rep=!!best; }
        if(best){ if(rep){ if(roomsDone[best.i].has(o.r.no)) inv.repeatRoom++; if(p===1&&slot.t[0]!==null&&pairs.has(pk(best))) inv.repeatPair++; slot.rep[p]=true; }
          slot.t[p]=best.i; usedDate.add(best.i); load[best.i]++; roomsDone[best.i].add(o.r.no); }
      }
      if(slot.t[0]!==null&&slot.t[1]!==null) pairs.add(Math.min(slot.t[0],slot.t[1])+"-"+Math.max(slot.t[0],slot.t[1]));
    });
  });
  S.days.forEach((d,i)=>inv.days.push(Ds[i]||{di:i,date:"",rooms:{}}));
  // duty changes
  const seenCh=new Set();
  S.changes.forEach((ch,i)=>{
    const di=num(ch.day)-1, rno=T(ch.room), pos=(T(ch.pos)==="INVI 2"?1:0), tn=T(ch.teacher);
    if(!T(ch.day)&&!rno&&!tn){ P.issues.changes[i]=""; return; }
    const D=inv.days[di]; let msg="";
    const t=teachers.find(x=>x.name===tn);
    if(!D||!D.date) msg="⚠ Choose an exam day that has a date";
    else if(!D.rooms[rno]) msg="⚠ Room not in use";
    else if(D.rooms[rno].need<pos+1) msg="⚠ No "+(pos?"INVI 2":"INVI 1")+" needed in this room that day";
    else if(!t) msg="⚠ Choose a teacher from the list";
    else if(!t.avail) msg="⚠ Teacher marked not available";
    else if(t.off.has(di+1)) msg="⚠ Teacher is off on Day "+(di+1);
    else if(two&&t.sess&&t.sess!==D.sess) msg="⚠ "+SESS_NAME[t.sess]+" teacher in a "+SESS_NAME[D.sess]+" sitting";
    else if(seenCh.has(di+"|"+rno+"|"+pos)) msg="⚠ Same duty changed twice";
    if(!msg){ const slot=D.rooms[rno]; const old=slot.t[pos]; seenCh.add(di+"|"+rno+"|"+pos);
      if(old!==null) load[old]--; slot.t[pos]=t.i; slot.changed[pos]=true; load[t.i]++; P.issues.changes[i]="✔ Changed"; }
    else P.issues.changes[i]=msg;
  });
  // totals; clashes per DATE (covers both sessions)
  const byDate={};
  inv.days.forEach(D=>{ if(!D.date) return; const cnt=byDate[D.date]=byDate[D.date]||{};
    Object.values(D.rooms).forEach(sl=>{ for(let p=0;p<sl.need;p++){ inv.needTotal++; if(sl.t[p]===null) inv.unfilled++; else { inv.filled++; cnt[sl.t[p]]=(cnt[sl.t[p]]||0)+1; } } }); });
  inv.days.forEach(D=>{ if(!D.date){ D.clash=new Set(); return; } const cnt=byDate[D.date]; D.clash=new Set(Object.keys(cnt).filter(k=>cnt[k]>1).map(Number)); });
  Object.values(byDate).forEach(cnt=>{ inv.clashes+=Object.values(cnt).filter(v=>v>1).length; });
  S.changes.forEach((ch,i)=>{ if(P.issues.changes[i]==="✔ Changed"){ const D=inv.days[num(ch.day)-1]; const t=teachers.find(x=>x.name===T(ch.teacher)); if(D&&t&&D.clash.has(t.i)) P.issues.changes[i]="⚠ Teacher already has a duty that date"; } });
  inv.tname=(i)=>{ if(i===null||i===undefined) return ""; const t=teachers[i]; return S.setup.names==="full"?t.name:t.short; };
  P.inv=inv;
}

/* ===================== IO: tiny XLSX reader / writer, import & export ===================== */
async function unzip(buf){
  const dv=new DataView(buf), u8=new Uint8Array(buf);
  let eocd=-1; for(let i=u8.length-22;i>=Math.max(0,u8.length-70000);i--){ if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;} }
  if(eocd<0) throw new Error("Not a valid .xlsx file");
  const n=dv.getUint16(eocd+10,true); let p=dv.getUint32(eocd+16,true); const files={};
  const dec=new TextDecoder();
  for(let k=0;k<n;k++){
    const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true), nl=dv.getUint16(p+28,true), el=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true), lho=dv.getUint32(p+42,true);
    const name=dec.decode(u8.subarray(p+46,p+46+nl)); p+=46+nl+el+cl;
    const lnl=dv.getUint16(lho+26,true), lel=dv.getUint16(lho+28,true); const start=lho+30+lnl+lel;
    files[name]={method,data:u8.subarray(start,start+csize)};
  }
  return {
    has:n=>!!files[n],
    async text(name){ const f=files[name]; if(!f) return null;
      if(f.method===0) return dec.decode(f.data);
      const ds=new DecompressionStream("deflate-raw"); const s=new Blob([f.data]).stream().pipeThrough(ds);
      return await new Response(s).text(); }
  };
}
function xmlDoc(t){ return new DOMParser().parseFromString(t,"application/xml"); }
async function readXlsx(buf){
  const z=await unzip(buf);

  const rels=xmlDoc(await z.text("xl/_rels/workbook.xml.rels"));
  const relMap={}; Array.from(rels.getElementsByTagName("Relationship")).forEach(r=>relMap[r.getAttribute("Id")]=r.getAttribute("Target"));
  const ss=[]; const sst=await z.text("xl/sharedStrings.xml");

      else if(t==="str"||t==="e") val=v?v.textContent:null;
      else if(t==="b") val=v?v.textContent==="1":null;
      else if(v) { const x=Number(v.textContent); val=isFinite(x)?x:v.textContent; }
      if(val!==null && val!=="") cells[r]=val;

}
const serialToISO=v=>{ if(typeof v==="number"&&v>20000&&v<80000){ const d=new Date(Date.UTC(1899,11,30)+v*86400000); return d.toISOString().slice(0,10);} if(typeof v==="string"&&/^\d{4}-\d{2}-\d{2}/.test(v)) return v.slice(0,10); return ""; };

/* ---- import a workbook made by the Excel version (v2 / v3 / v4) or a plain student list ---- */
function importWorkbook(sheets){

    if(String(g(su,"C21")||"").startsWith("MANUAL")) st.mode="manual";

    N.classes=[];

      N.classes.push({name:String(n),grade:String(g("CLASSES","C"+r)||""),appearing:String(g("CLASSES","E"+r))==="Yes",strength:Number(g("CLASSES","D"+r))||0,stream:String(g("CLASSES","F"+r)||""),order:g("CLASSES","G"+r)??""}); }
    const v4=String(g("STUDENTS","E5")||"").startsWith("Status");
    N.students=[];
    for(let r=6;r<=2005;r++){ const c=g("STUDENTS","B"+r), roll=g("STUDENTS","C"+r), nm=g("STUDENTS","D"+r);
      if(c===undefined&&roll===undefined&&nm===undefined) continue;
      N.students.push({cls:String(c??""),roll:roll??"",name:String(nm??"").trim(),status:v4?String(g("STUDENTS","E"+r)||""):""}); }
    const rr=sheets["ROOMS"]; const newRooms=String(g("ROOMS","J5")||"").startsWith("Benches");
    N.rooms=[];
    for(let r=6;r<=35;r++){ const no=g("ROOMS","B"+r); if(no===undefined) continue;
      let lines=[], depth=0;
      if(newRooms){ for(const c of ["D","E","F","G","H","I"]){ const x=g("ROOMS",c+r); if(x!==undefined&&x!=="") lines.push(Number(x)); } depth=Number(g("ROOMS","J"+r))||0; }
      else { const rows=Number(g("ROOMS","D"+r))||0; for(let i=0;i<rows;i++) lines.push(1); depth=Number(g("ROOMS","E"+r))||0; }
      N.rooms.push({no:String(no),loc:String(g("ROOMS","C"+r)||""),lines,depth,use:String(g("ROOMS",(newRooms?"M":"G")+r))==="Yes",
        fixed:[String(g("ROOMS","T"+r)||""),String(g("ROOMS","U"+r)||""),String(g("ROOMS","V"+r)||"")],inv:""}); }
    // invigilator keys (by room number)
    for(let r=13;r<=42;r++){ const no=g("INVIGILATION","AM"+r), key=g("INVIGILATION","AO"+r); if(no===undefined||key===undefined) continue;
      const room=N.rooms.find(x=>x.no===String(no)); if(room&&(key===1||key===2||key==="1"||key==="2")) room.inv=String(key); }
    // date sheet

    N.days=[];
    for(let r=8;r<=19;r++){ const date=serialToISO(g(ds,"B"+r)); const time=String(g(ds,"D"+r)||""); const subj={};
      grades.forEach((gr,i)=>{ const v=g(ds,colL(4+i)+r); if(gr&&v!==undefined&&String(v).trim()) subj[gr]=String(v); });

      N.teachers.push({name:String(nm).trim(),short:String(g("INVIGILATION","AE"+r)||""),avail:String(g("INVIGILATION","AF"+r)||"Yes")!=="No"}); }
    // overrides (v4)
    if(sheets["SPECIAL SEATS"]) for(let r=6;r<=35;r++){ const c=g("SPECIAL SEATS","B"+r); if(c===undefined) continue;
      N.specials.push({cls:String(c),roll:g("SPECIAL SEATS","C"+r)??"",room:String(g("SPECIAL SEATS","E"+r)??""),row:g("SPECIAL SEATS","F"+r)??"",seat:g("SPECIAL SEATS","G"+r)??"",reason:String(g("SPECIAL SEATS","H"+r)||"")}); }
    if(sheets["ABSENTEES"]) for(let r=6;r<=305;r++){ const c=g("ABSENTEES","C"+r); if(c===undefined) continue;
      N.absentees.push({day:g("ABSENTEES","B"+r)??"",cls:String(c),roll:g("ABSENTEES","D"+r)??"",remark:String(g("ABSENTEES","I"+r)||"")}); }
    if(sheets["DUTY CHANGES"]) for(let r=6;r<=55;r++){ const t=g("DUTY CHANGES","F"+r); if(t===undefined) continue;
      N.changes.push({day:g("DUTY CHANGES","B"+r)??"",room:String(g("DUTY CHANGES","C"+r)??""),pos:String(g("DUTY CHANGES","D"+r)||"INVI 1"),teacher:String(t),reason:String(g("DUTY CHANGES","G"+r)||"")}); }

    if(N.specials.length||N.absentees.length||N.changes.length) report.push(`Overrides: ${N.specials.length} special seats, ${N.absentees.length} absentees, ${N.changes.length} duty changes`);

  for(const [name,cells] of Object.entries(sheets)){
    const refs=Object.keys(cells);
    for(let r=1;r<=15;r++){
      const hdr={}; for(let c=0;c<26;c++){ const v=String(cells[colL(c)+r]||"").toLowerCase(); if(!v) continue;
        if(/class|section/.test(v)&&hdr.cls===undefined) hdr.cls=c; else if(/roll/.test(v)&&hdr.roll===undefined) hdr.roll=c; else if(/name/.test(v)&&hdr.name===undefined) hdr.name=c; else if(/status/.test(v)) hdr.status=c; }

        const out=[]; const maxR=Math.max(...refs.map(x=>Number(x.replace(/[A-Z]+/,""))));

        return {kind:"students",students:out,report:[`Sheet "${name}": ${out.length} students found`]};
      }
    }

}

  files.push({name:"xl/styles.xml",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF17785C"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`});
  sheets.forEach((s,i)=>{
    const cols=s.widths?`<cols>${s.widths.map((w,j)=>`<col min="${j+1}" max="${j+1}" width="${w}" customWidth="1"/>`).join("")}</cols>`:"";
    const rows=s.rows.map((row,ri)=>`<row r="${ri+1}">${row.map((v,ci)=>{ const ref=colL(ci)+(ri+1); const st=ri===0?' s="1"':"";
      if(v===null||v===undefined||v==="") return ""; if(typeof v==="number") return `<c r="${ref}"${st}><v>${v}</v></c>`;
      return `<c r="${ref}"${st} t="inlineStr"><is><t xml:space="preserve">${xesc(v)}</t></is></c>`; }).join("")}</row>`).join("");
    files.push({name:`xl/worksheets/sheet${i+1}.xml`,data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><sheetFormatPr defaultRowHeight="15"/>${cols}<sheetData>${rows}</sheetData></worksheet>`});

function download(blob,name){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500); }
function safeName(s){ return String(s).replace(/[^\w\- ]+/g,"").replace(/\s+/g,"_"); }

/* ===================== UPLOAD: students / date sheet / teachers from Excel + templates ===================== */
const ROMAN={1:"I",2:"II",3:"III",4:"IV",5:"V",6:"VI",7:"VII",8:"VIII",9:"IX",10:"X",11:"XI",12:"XII"};
const ROM2N=Object.fromEntries(Object.entries(ROMAN).map(([n,r])=>[r,Number(n)]));
const normKey=s=>String(s??"").toUpperCase().replace(/^(CLASS|STD\.?|STANDARD|GRADE)\s*/,"").replace(/[\s\-_.\/]+/g,"");
/* "VI A", "6-A", "Class 6 A", "6A", ("VI","A") → canonical "6A"; matched to an existing class when possible */
function canonClass(cls,sec){
  let k=normKey(cls); const s=normKey(sec); let m;
  k=({NURSERY:"NUR",LKG:"KGI",UKG:"KGII",KG1:"KGI",KG2:"KGII"})[k]||k;
  if((m=k.match(/^(XII|XI|IX|X|VIII|VII|VI|IV|V|III|II|I)([A-Z]?)$/))) return ROM2N[m[1]]+(m[2]||s);
  if((m=k.match(/^(\d{1,2})([A-Z]?)$/))) return Number(m[1])+(m[2]||s);
  return k+s;
}
function normClass(cls,sec){
  const raw=String(cls??"").trim(); if(!raw&&!String(sec??"").trim()) return "";
  const want=canonClass(cls,sec); const hit=S.classes.find(x=>canonClass(x.name,"")===want);
  if(hit) return T(hit.name);
  return /^\d+[A-Z]?$/.test(want)?want:(raw+(sec?String(sec).trim():""));
}
function gradeFromClass(name){ const m=normKey(name).match(/^(\d{1,2})/); if(m&&ROMAN[Number(m[1])]) return ROMAN[Number(m[1])];
  const k=normKey(name); if(/^NUR/.test(k)) return "NUR"; if(/^KGII|^UKG/.test(k)) return "KG-II"; if(/^KGI|^LKG/.test(k)) return "KG-I"; return ""; }
function normGrade(h){ const k=normKey(h).replace(/^CLASS/,""); if(GRADES_ALL.includes(k)) return k; if(ROMAN[Number(k)]) return ROMAN[Number(k)];
  if(k==="KGI"||k==="LKG") return "KG-I"; if(k==="KGII"||k==="UKG") return "KG-II"; if(k==="NURSERY") return "NUR"; return ""; }
function normGroup(v){ const k=String(v??"").trim().toLowerCase(); if(!k) return ""; if(/^sci/.test(k)) return "Science"; if(/^(art|hum)/.test(k)) return "Arts"; if(/^com/.test(k)) return "Commerce"; return String(v).trim(); }
function normSess(v){ const k=String(v??"").trim().toLowerCase(); if(/^(n|an|after|noon|eve|2|second|ii)/.test(k)) return "N"; if(/^(m|fn|fore|morn|1|first|i)/.test(k)) return "M"; return ""; }
/* "XI Science", "Class XI - Sci", "XI (all)" → {g:"XI", grp:"Science"|""} */
function gradeGroupOf(h){ const raw=String(h??""); const m=raw.match(/\b(science|sci\.?|arts?|humanities|commerce|com\.?)\b/i);
  const rest=raw.replace(/\((all|common)\)/i,"").replace(m?m[0]:"\u0000","").replace(/[-–(),]/g," ").trim(); const g=normGrade(rest); if(!g) return null; return {g,grp:m?normGroup(m[1]):""}; }
const MON={JAN:1,FEB:2,MAR:3,APR:4,MAY:5,JUN:6,JUL:7,AUG:8,SEP:9,OCT:10,NOV:11,DEC:12};
function toISO(v){
  if(v===undefined||v===null||v==="") return "";
  if(typeof v==="number") return serialToISO(v);
  const s=String(v).trim(); let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
  if((m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/))){ const y=m[3].length===2?"20"+m[3]:m[3]; return `${y}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`; }  // dd-mm-yyyy (India)
  if((m=s.match(/^(\d{1,2})(?:st|nd|rd|th)?[\s\-.\/]*([A-Za-z]{3})[A-Za-z]*[\s\-.,\/]*(\d{2,4})$/))&&MON[m[2].toUpperCase()]){ const y=m[3].length===2?"20"+m[3]:m[3]; return `${y}-${String(MON[m[2].toUpperCase()]).padStart(2,"0")}-${m[1].padStart(2,"0")}`; }
  if((m=s.match(/^([A-Za-z]{3})[A-Za-z]*\s+(\d{1,2}),?\s+(\d{4})$/))&&MON[m[1].toUpperCase()]) return `${m[3]}-${String(MON[m[1].toUpperCase()]).padStart(2,"0")}-${m[2].padStart(2,"0")}`;
  return "";
}
function fmtTime(v){ if(typeof v==="number"&&v>0&&v<1){ let m=Math.round(v*1440), h=Math.floor(m/60); m%=60; const ap=h>=12?"PM":"AM"; h=h%12||12; return `${h}:${String(m).padStart(2,"0")} ${ap}`; } return String(v??"").trim(); }

/* find the header row in any sheet: tests = {key: regex}; required keys must all be found */
function findTable(sheets,tests,required,prefer){
  let best=null;
  const order=Object.keys(sheets).sort((a,b)=>(prefer&&prefer.test(b)?1:0)-(prefer&&prefer.test(a)?1:0));
  for(const name of order){ const cells=sheets[name]; const refs=Object.keys(cells); if(!refs.length) continue;
    const maxR=Math.max(...refs.map(x=>Number(x.replace(/[A-Z]+/,"")))), maxC=Math.min(60,Math.max(...refs.map(x=>{ const L=x.replace(/\d+/,""); let n=0; for(const ch of L) n=n*26+ch.charCodeAt(0)-64; return n; })));
    for(let r=1;r<=Math.min(20,maxR);r++){ const hdr={}, other=[];
      for(let c=0;c<maxC;c++){ const raw=cells[colL(c)+r]; if(raw===undefined) continue; const v=String(raw).trim(); let used=false;
        for(const [k,re] of Object.entries(tests)){ if(hdr[k]===undefined&&re.test(v)){ hdr[k]=c; used=true; break; } }
        if(!used) other.push({c,v}); }
      if(required.every(k=>hdr[k]!==undefined)){ const sc=Object.keys(hdr).length; if(!best||sc>best.score) best={sheet:name,cells,row:r,hdr,other,maxR,score:sc}; break; }
    } }
  return best;
}
const cell=(t,c,r)=>c===undefined?undefined:t.cells[colL(c)+r];
const isExample=(t,r)=>Object.values(t.hdr).concat(t.other.map(o=>o.c)).some(c=>/^\s*(example|e\.g\.)/i.test(String(cell(t,c,r)??"")));

function parseStudents(sheets){
  const t=findTable(sheets,{roll:/^roll|roll\s*no|^r\.?\s*no/i,name:/name/i,sec:/^sec(tion)?$/i,group:/^(group|stream|faculty)/i,cls:/^(class|std|standard|grade)|class|section/i,status:/status|remark/i},["roll","name"],/stud/i);
  if(!t) return null;
  if(t.hdr.cls===undefined&&t.hdr.sec!==undefined){ t.hdr.cls=t.hdr.sec; delete t.hdr.sec; }
  const out=[], warn=[], seen=new Set(); let skipped=0;
  for(let r=t.row+1;r<=t.maxR;r++){
    const c=cell(t,t.hdr.cls,r), sec=cell(t,t.hdr.sec,r), roll=cell(t,t.hdr.roll,r), nm=cell(t,t.hdr.name,r);
    if(c===undefined&&roll===undefined&&nm===undefined) continue;
    if(isExample(t,r)) { skipped++; continue; }
    const cls=normClass(c,sec); let st=String(cell(t,t.hdr.status,r)??"").trim();
    const stOk=STATUS_OUT.find(x=>x.toLowerCase()===st.toLowerCase()); if(st&&!stOk){ if(!/^(appearing|present|ok|-)$/i.test(st)) warn.push(`Row ${r}: status "${st}" not known — left as Appearing`); st=""; } else st=stOk||"";
    const rn=Number(roll);
    if(!cls) warn.push(`Row ${r}: no class`);
    if(!(Number.isInteger(rn)&&rn>0)) warn.push(`Row ${r}: roll "${roll??""}" is not a whole number`);
    const key=cls+"|"+rn; if(seen.has(key)) warn.push(`Row ${r}: ${cls} roll ${rn} appears twice`); seen.add(key);
    const grp=normGroup(cell(t,t.hdr.group,r));
    if(grp&&!(S.setup.groups||[]).includes(grp)) warn.push(`Row ${r}: group "${grp}" — switch it on in School & Exam (Science / Arts)`);
    out.push({cls,roll:Number.isInteger(rn)?rn:(roll??""),name:String(nm??"").trim().replace(/\s+/g," "),status:st,group:grp});
  }
  const byCls={}; out.forEach(s=>byCls[s.cls]=(byCls[s.cls]||0)+1);
  const newCls=Object.keys(byCls).filter(c=>c&&!S.classes.some(x=>T(x.name)===c));
  const off=Object.keys(byCls).filter(c=>S.classes.some(x=>T(x.name)===c&&!x.appearing));
  if(off.length) warn.unshift(`Not writing this exam (Appearing not ticked on Classes): ${off.join(", ")} — their students are saved but not seated`);
  return {kind:"students",sheet:t.sheet,rows:out,warn,byCls,newCls,skipped};
}
function parseDays(sheets){
  const t=findTable(sheets,{date:/^date|date$/i,sess:/^(session|shift|sitting)$/i,time:/time|timing/i,day:/^day$/i},["date"],/date|routine|time/i);
  if(!t) return null;
  const gcols=[]; t.other.forEach(o=>{ const x=gradeGroupOf(o.v); if(x) gcols.push({c:o.c,g:x.grp?x.g+"|"+x.grp:x.g,label:x.grp?x.g+" "+x.grp:x.g}); });
  // also: subject columns named "Class VI" etc. caught above; a single "Subject" column with a Class column = long format
  const out=[], warn=[];
  for(let r=t.row+1;r<=t.maxR;r++){
    const dv=cell(t,t.hdr.date,r); if(dv===undefined) { if(gcols.some(g=>cell(t,g.c,r)!==undefined)) warn.push(`Row ${r}: subjects without a date — skipped`); continue; }
    if(isExample(t,r)) continue;
    const date=toISO(dv); if(!date){ warn.push(`Row ${r}: date "${dv}" not understood (use dd-mm-yyyy)`); continue; }
    const subj={}; gcols.forEach(g=>{ const v=cell(t,g.c,r); if(v!==undefined&&String(v).trim()&&!/^[-–—]$/.test(String(v).trim())) subj[g.g]=String(v).trim(); });
    let ss=t.hdr.sess!==undefined?normSess(cell(t,t.hdr.sess,r)):"M"; if(!ss){ warn.push(`Row ${r}: session "${cell(t,t.hdr.sess,r)}" not understood — taken as Morning`); ss="M"; }
    out.push({date,sess:ss,time:fmtTime(cell(t,t.hdr.time,r)),subj});
  }
  out.sort((a,b)=>a.date.localeCompare(b.date)||(a.sess==="N")-(b.sess==="N"));
  const dup=out.filter((d,i)=>i&&d.date===out[i-1].date&&d.sess===out[i-1].sess).length;
  if(dup) warn.push(t.hdr.sess===undefined?`${dup} date(s) appear twice — add a Session column (Morning / Noon)`:`${dup} date + session appear twice`);
  const noon=out.some(d=>d.sess==="N"); if(noon&&!S.setup.twoSessions) warn.unshift("This date sheet has Noon papers — Two sessions will be switched on");
  const grpCols=[...new Set(gcols.filter(g=>g.g.includes("|")).map(g=>g.g.split("|")[1]))]; const offG=grpCols.filter(g=>!(S.setup.groups||[]).includes(g));
  if(offG.length) warn.unshift(`Group columns ${offG.join(", ")} — the group(s) will be switched on`);
  const used=new Set(S.classes.filter(c=>c.appearing).map(c=>T(c.grade)));
  const missing=[...used].filter(g=>g&&!gcols.some(x=>x.g.split("|")[0]===g));
  if(missing.length) warn.push(`No column for grade(s) ${missing.join(", ")} — they will have no paper on these days`);
  return {kind:"days",sheet:t.sheet,rows:out,warn,grades:gcols.map(g=>g.label),noon,newGroups:offG,groupGrades:[...new Set(gcols.filter(g=>g.g.includes("|")).map(g=>g.g.split("|")[0]))]};
}
function parseTeachers(sheets){
  const t=findTable(sheets,{name:/name|teacher/i,short:/short|initial|code|abbr/i,sess:/^(session|shift)/i,avail:/avail|duty|active/i,off:/not\s*avail|off|leave|absent|except/i},["name"],/teach|staff|invig/i);
  if(!t) return null;
  // "Not available on days" must not be taken as "Available"
  if(t.hdr.avail!==undefined&&/not/i.test(String(cell(t,t.hdr.avail,t.row)))){ t.hdr.off=t.hdr.avail; delete t.hdr.avail; }
  const out=[], warn=[], seen=new Set();
  for(let r=t.row+1;r<=t.maxR;r++){
    const nm=String(cell(t,t.hdr.name,r)??"").trim().replace(/\s+/g," "); if(!nm||isExample(t,r)) continue;
    if(seen.has(nm.toUpperCase())) warn.push(`Row ${r}: ${nm} appears twice`); seen.add(nm.toUpperCase());
    const av=String(cell(t,t.hdr.avail,r)??"").trim();
    const sv=String(cell(t,t.hdr.sess,r)??"").trim(); const ss=/^(any|both|all)?$/i.test(sv)?"":normSess(sv);
    out.push({name:nm,short:String(cell(t,t.hdr.short,r)??"").trim(),avail:!/^(no|n|false|0|x)$/i.test(av),off:String(cell(t,t.hdr.off,r)??"").trim(),sess:ss});
  }
  const sh={}; out.forEach(x=>{ if(x.short){ if(sh[x.short]) warn.push(`Short name "${x.short}" used by ${sh[x.short]} and ${x.name}`); sh[x.short]=x.name; } });
  return {kind:"teachers",sheet:t.sheet,rows:out,warn};
}

/* ---------- dialog ---------- */
async function uploadFile(kind,file){
  let sheets;
  try{ sheets=await readXlsx(await file.arrayBuffer()); }catch(err){ alert("Could not read this file. Save it in Excel as .xlsx and try again.\n\n"+err.message); return; }
  const res=kind==="students"?parseStudents(sheets):kind==="days"?parseDays(sheets):parseTeachers(sheets);
  const need={students:"Class, Roll No. and Student Name",days:"Date (and Time, VI, VII … grade columns)",teachers:"Teacher Name"}[kind];
  if(res&&!res.rows.length){ openModal(`<h3>No data in the file yet</h3><p>Sheet "${esc(res.sheet)}" has the right headings but only example rows or no rows.</p><p class="hint">Type your data under the headings (over the brown example rows), save, and upload again.</p><div class="row" style="justify-content:flex-end"><button class="btn pri" data-act="close">OK</button></div>`); return; }
  if(!res){ openModal(`<h3>Nothing found</h3><p>No sheet in "${esc(file.name)}" has the headings <b>${need}</b>.</p><p class="hint">Download the template, copy your data into it, and upload again.</p><div class="row" style="justify-content:flex-end"><button class="btn" data-act="tpl" data-k="${kind}">📄 Download template</button><button class="btn pri" data-act="close">OK</button></div>`); return; }
  const W=res.warn.length?`<div class="note" style="margin:10px 0;max-height:150px;overflow:auto"><b>⚠ ${res.warn.length} thing(s) to check:</b><br>${res.warn.slice(0,40).map(esc).join("<br>")}${res.warn.length>40?"<br>…":""}</div>`:`<div class="pill ok" style="margin:8px 0">✔ No problems found</div>`;
  let body="", opts="";
  if(kind==="students"){
    const cls=Object.entries(res.byCls).map(([c,n])=>`<span class="pill ${res.newCls.includes(c)?"sp":"info"}">${esc(c||"?")} · ${n}</span>`).join(" ");
    body=`<p><b>${res.rows.length}</b> students from sheet "${esc(res.sheet)}"${res.skipped?` (${res.skipped} example rows skipped)`:""}</p><div class="row" style="gap:4px">${cls}</div>
      ${res.newCls.length?`<p class="hint" style="margin-top:6px">Purple = new class, will be added to Classes (grade guessed from the name, ticked Appearing).</p>`:""}`;
    opts=`<label><input type="radio" name="um" value="classes" checked> Replace only the classes in this file <span class="hint">(other classes stay as they are)</span></label><br>
      <label><input type="radio" name="um" value="replace"> Replace the whole student list</label><br><label><input type="radio" name="um" value="append"> Add to the list</label>`;
  } else if(kind==="days"){
    body=`<p><b>${res.rows.length}</b> exam days from sheet "${esc(res.sheet)}" · grades: ${res.grades.map(esc).join(", ")||"none"}</p>
      <table class="t" style="font-size:12px"><tr><th>Date</th><th>Time</th><th>Papers</th></tr>${res.rows.slice(0,12).map(d=>`<tr><td>${fmtDate(d.date)} (${dayName(d.date)})</td><td>${esc(d.time)}</td><td>${S.setup.twoSessions||res.noon?`<b>${d.sess==="N"?"Noon":"Morning"}</b> · `:""}${Object.entries(d.subj).map(([g,s])=>`${esc(g.replace("|"," "))}: ${esc(s)}`).join(" · ")||"<i>all classes</i>"}</td></tr>`).join("")}</table>`;
    opts=`<label><input type="radio" name="um" value="replace" checked> Replace the date sheet</label><br><label><input type="radio" name="um" value="append"> Add these days</label>
      ${S.absentees.length||S.changes.length?`<div class="note" style="margin-top:6px">Absentees and duty changes use day numbers — check them after replacing the date sheet.</div>`:""}`;
  } else {
    body=`<p><b>${res.rows.length}</b> teachers from sheet "${esc(res.sheet)}" · ${res.rows.filter(t=>!t.avail).length} not available · ${res.rows.filter(t=>t.off).length} with off-days</p>`;
    opts=`<label><input type="radio" name="um" value="replace" checked> Replace the teacher list</label><br><label><input type="radio" name="um" value="append"> Add teachers not already on the list</label>`;
  }
  openModal(`<h3>📥 Upload ${kind==="days"?"date sheet":kind} — check before saving</h3>${body}${W}<div style="margin-top:8px">${opts}</div>
    <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn" data-act="close">Cancel</button><button class="btn pri" data-act="modalOk">Save upload</button></div>`);
  UI.modalOk=()=>{ pushUndo("upload "+kind); const m=document.querySelector('input[name="um"]:checked').value;
    if(kind==="students"){
      res.newCls.forEach(c=>{ if(c) S.classes.push({name:c,grade:gradeFromClass(c),appearing:true,strength:0,stream:"",order:""}); });
      if(m==="replace") S.students=res.rows;
      else if(m==="append") S.students.push(...res.rows);
      else { const set=new Set(Object.keys(res.byCls)); S.students=S.students.filter(s=>!set.has(T(s.cls))).concat(res.rows); }
      const ci={}; S.classes.forEach((c,j)=>ci[T(c.name)]=j); S.students.sort((x,y)=>((ci[T(x.cls)]??999)-(ci[T(y.cls)]??999))||(num(x.roll)-num(y.roll)));
    } else if(kind==="days"){
      if(m==="replace") S.days=res.rows; else { S.days.push(...res.rows); S.days.sort((a,b)=>String(a.date).localeCompare(String(b.date))||(a.sess==="N")-(b.sess==="N")); }
      if(res.noon){ S.setup.twoSessions=true;
        const gs={}; S.days.forEach(d=>Object.entries(d.subj||{}).forEach(([k,v])=>{ if(!T(v)) return; const g=k.split("|")[0]; (gs[g]=gs[g]||new Set()).add(d.sess==="N"?"N":"M"); }));
        S.classes.forEach(c=>{ const set=gs[T(c.grade)]; if(set&&set.size===1) c.sess=[...set][0]; }); }
      if(res.newGroups.length){ S.setup.groups=GROUPS_ALL.filter(g=>(S.setup.groups||[]).includes(g)||res.newGroups.includes(g)); }
      res.groupGrades.forEach(g=>{ if(!S.setup.groupGrades.includes(g)) S.setup.groupGrades.push(g); });
    } else {
      if(m==="replace") S.teachers=res.rows; else res.rows.forEach(t=>{ if(!S.teachers.some(x=>T(x.name).toUpperCase()===t.name.toUpperCase())) S.teachers.push(t); });
    }

}

function chartTable(room,dayIdx,clickable){
  const P=PLAN; let h="<table>";
  h+=`<tr><td></td>${Array.from({length:room.R},(_,c)=>`<th class="bench" style="background:${room.benchOf[c]%2?"var(--dark)":"var(--teal)"}">BENCH ${room.benchOf[c]+1}</th>`).join("")}</tr>`;
  h+=`<tr><td></td>${Array.from({length:room.R},(_,c)=>`<th class="rowh">ROW-${c+1}${P.zig?"":" ("+LETTER[c%P.N]+")"}</th>`).join("")}</tr>`;
  for(let d=0;d<room.D;d++){ h+=`<tr><td class="sno">${d+1}</td>`;
    for(let c=0;c<room.R;c++){ const s=room.grid[c][d]; let cl="seat ", txt="—";
      if(s.cls){ txt=`${esc(s.cls)}-${s.roll}`; cl+= s.special?"spc":(dayIdx!==null&&dayIdx!==undefined&&P.paperOf(dayIdx,s.stu)===null)?"nop":"s"+LETTER[s.stream]; } else cl+="vac";
      const edge= c+1<room.R&&room.benchOf[c+1]!==room.benchOf[c] ? "margin-right:6px;border-right:3px solid var(--dark);" : "";
      h+=`<td class="${cl}" style="${edge}" ${clickable?`data-seat="${room.no}|${c}|${d}"`:""} title="${esc(s.name||"")}${s.group?" ("+esc(s.group)+")":""}">${txt}${s.special?" ★":""}</td>`; }
    h+="</tr>"; }
  return h+"</table>";
}
function invig(){

  let h=`<div class="toolbar"><button class="btn gold" data-act="shuffle">🔀 New arrangement</button><span class="pill ${inv.unfilled?"bad":"ok"}">${inv.filled}/${inv.needTotal} filled</span><span class="pill ${inv.clashes?"bad":"ok"}">${inv.clashes} clashes</span><span class="pill ${inv.repeatRoom?"bad":"ok"}">${inv.repeatRoom} same-room repeats</span><span class="pill ${inv.repeatPair?"bad":"ok"}">${inv.repeatPair} same-pair repeats</span><span class="hint">✎ changed • ↺ repeat (not enough teachers) • grey = no paper</span></div>
  <div class="tbl-wrap"><table class="t"><tr><th>Room</th>${ds.map(d=>`<th>Day ${d.di+1}<br><small>${dayName(d.date)} ${fmtDate(d.date,{day:"2-digit",month:"short"})}${P.two?" · "+SESS_NAME[d.sess]:""}</small></th>`).join("")}</tr>`;

  return h+`</table></div>`;

function setPath(path,val,el){
  const parts=path.split("."); let o=S;
  for(let i=0;i<parts.length-1;i++){ const k=parts[i]; if(o[k]===undefined) o[k]=isNaN(parts[i+1])?{}:[]; o=o[k]; }
  const last=parts[parts.length-1];
  if(el&&el.type==="checkbox") val=el.checked;
  else if(path.endsWith(".lines")) val=String(val).split(/[^0-9]+/).filter(Boolean).map(Number);
  else if(["streams","invThreshold","spare","shuffle"].includes(last)) val=Number(val)||0;
  else if(last==="twoSessions") val=val==="1";
  o[last]=val;
}

function examSnap(){

    fixed:Object.fromEntries(S.rooms.map(r=>[T(r.no),clone(r.fixed||["","",""])])),

}
function examApply(x){
  S.setup.exam=x.exam; S.setup.shuffle=x.shuffle; S.days=clone(x.days||[]); S.absentees=clone(x.absentees||[]); S.changes=clone(x.changes||[]); S.specials=clone(x.specials||[]);

function rgbHex(c){ const m=String(c).match(/rgba?\(([\d.]+),\s*([\d.]+),\s*([\d.]+)(?:,\s*([\d.]+))?\)/); if(!m) return null; if(m[4]!==undefined&&Number(m[4])<0.1) return null;
  return "FF"+[m[1],m[2],m[3]].map(x=>Math.round(Number(x)).toString(16).padStart(2,"0")).join("").toUpperCase(); }
function styleOf(el,extra){ const cs=getComputedStyle(el); const fill=rgbHex(cs.backgroundColor); const color=rgbHex(cs.color);
  const ta=cs.textAlign; return Object.assign({b:Number(cs.fontWeight)>=600,sz:Math.max(7,Math.min(20,Math.round(parseFloat(cs.fontSize)*0.75))),color:color&&color!=="FF000000"?color:null,fill:fill&&fill!=="FFFFFFFF"?fill:null,
    h:ta==="center"?"center":ta==="right"||ta==="end"?"right":null,i:cs.fontStyle==="italic"}, extra||{}); }
function textOf(el){ return (el.innerText||"").replace(/ /g," ").replace(/[ \t]+\n/g,"\n").trim(); }
/* convert the report pages inside `root` into one worksheet (pages stacked, page breaks between) */
function pagesToSheet(root,name){
  const sh={name,cells:{},merges:[],widths:[],heights:{},breaks:[],land:!!root.querySelector(".page.land")};
  const set=(r,c,v,st)=>{ sh.cells[r+","+c]={v,st}; };
  let r=0, W=1;
  const pages=[...root.querySelectorAll(".page")];
  pages.forEach(pg=>{
    const grid=pg.querySelector(".labels,.slips,.pkts");
    W=grid?(grid.classList.contains("labels")?3:2):Math.max(6,...[...pg.querySelectorAll("table")].map(t=>Math.max(0,...[...t.rows].map(tr=>[...tr.cells].reduce((a,c)=>a+(c.colSpan||1),0)))));
    const line=(el,txt,st)=>{ if(!txt) return; set(r,0,txt,st||styleOf(el)); if(W>1) sh.merges.push([r,0,r,W-1]); const n=txt.split("\n").length; if(n>1) sh.heights[r]=15*n; r++; };
    const walk=el=>{ for(const ch of el.children){
      if(ch.classList.contains("pfoot")) continue;
      if(ch.classList.contains("ph")){ ch.querySelectorAll(".t1,.t2,.t3").forEach(x=>line(x,textOf(x),styleOf(x,{h:"center"}))); continue; }
      if(ch.classList.contains("sign")){ const d=[...ch.children]; r++; set(r,0,textOf(d[0]),{b:true,top:true}); set(r,W-1,textOf(d[1]||d[0]),{b:true,h:"right",top:true}); r+=2; continue; }
      if(ch.matches(".labels,.slips,.pkts")){ const cards=[...ch.children]; const n=W;
        for(let i=0;i<cards.length;i+=n){ let lines=1; cards.slice(i,i+n).forEach((cd,j)=>{ const t=textOf(cd); lines=Math.max(lines,t.split("\n").length); set(r,j,t,{wrap:true,border:true,sz:9,v:"top"}); }); sh.heights[r]=Math.min(400,13*lines+6); r++; }
        continue; }
      if(ch.tagName==="TABLE"){ table(ch); r++; continue; }
      if(ch.querySelector&&ch.querySelector("table")&&!ch.matches(".ptitle,.pinfo")){ walk(ch); continue; }
      line(ch,textOf(ch),styleOf(ch,{h:getComputedStyle(ch).textAlign==="center"||ch.matches(".ptitle,.pinfo")?"center":null}));
    } };
    const table=t=>{ const occ={}; [...t.rows].forEach((tr,ri)=>{ let c=0; [...tr.cells].forEach(td=>{ while(occ[ri+","+c]) c++;
        const cs=td.colSpan||1, rs=td.rowSpan||1, txt=textOf(td);
        for(let a=0;a<rs;a++) for(let b=0;b<cs;b++){ occ[(ri+a)+","+(c+b)]=1; if(a||b) set(r+ri+a,c+b,"",{border:true}); }
        set(r+ri,c,txt,styleOf(td,{border:true,wrap:txt.includes("\n")}));
        if(cs>1||rs>1) sh.merges.push([r+ri,c,r+ri+rs-1,c+cs-1]);
        const n=txt.split("\n").length; if(n>1) sh.heights[r+ri]=Math.max(sh.heights[r+ri]||0,14*n);
        c+=cs; }); });
      r+=t.rows.length; };
    walk(pg);
    sh.breaks.push(r); r++;
  });
  sh.breaks.pop();
  // column widths from content
  const cw={};
  Object.entries(sh.cells).forEach(([k,c])=>{ const [rr,cc]=k.split(",").map(Number); if(c.st&&c.st.top) return; if(sh.merges.some(m=>m[0]===rr&&m[1]===cc&&m[3]>m[1])) return;
    const len=Math.max(...String(c.v).split("\n").map(x=>x.length)); cw[cc]=Math.max(cw[cc]||0,len); });
  const maxC=Math.max(0,...Object.keys(sh.cells).map(k=>Number(k.split(",")[1])));
  for(let c=0;c<=maxC;c++) sh.widths[c]=Math.min(pages[0]&&pages[0].querySelector(".labels,.slips,.pkts")?48:42,Math.max(5,Math.round((cw[c]||4)*1.05+2)));
  return sh;
}
function writeXlsxStyled(sheets){
  const fonts=['<font><sz val="10"/><name val="Calibri"/></font>'], fills=['<fill><patternFill patternType="none"/></fill>','<fill><patternFill patternType="gray125"/></fill>'],

    let fillId=0; if(st.fill){ if(fl[st.fill]===undefined){ fl[st.fill]=fills.length; fills.push(`<fill><patternFill patternType="solid"><fgColor rgb="${st.fill}"/><bgColor indexed="64"/></patternFill></fill>`); } fillId=fl[st.fill]; }
    const bId=st.border?1:st.top?2:0;

    if(xi[xk]===undefined){ xi[xk]=xfs.length; xfs.push(`<xf numFmtId="0" fontId="${fi[fk]}" fillId="${fillId}" borderId="${bId}" xfId="0" applyFont="1"${fillId?' applyFill="1"':""}${bId?' applyBorder="1"':""} applyAlignment="1"><alignment${st.h?` horizontal="${st.h}"`:""} vertical="${st.v||"center"}"${st.wrap?' wrapText="1"':""}/></xf>`); }

  const used=new Set(); const sname=n=>{ let b=String(n).replace(/[\[\]:*?\/\\]/g," ").slice(0,28).trim()||"Sheet", x=b, i=2; while(used.has(x.toLowerCase())) x=b.slice(0,26)+" "+(i++); used.add(x.toLowerCase()); return x; };
  const names=sheets.map(s=>sname(s.name));

        return `<c r="${ref}" s="${s}" t="inlineStr"><is><t xml:space="preserve">${xesc(v)}</t></is></c>`; }).join("");
      const ht=sh.heights[r]; return `<row r="${r+1}"${ht?` ht="${ht}" customHeight="1"`:""}>${cells}</row>`; }).join("");
    const cols=sh.widths.length?`<cols>${sh.widths.map((w,j)=>`<col min="${j+1}" max="${j+1}" width="${w}" customWidth="1"/>`).join("")}</cols>`:"";
    const merges=sh.merges.length?`<mergeCells count="${sh.merges.length}">${sh.merges.map(m=>`<mergeCell ref="${colL(m[1])}${m[0]+1}:${colL(m[3])}${m[2]+1}"/>`).join("")}</mergeCells>`:"";
    const brks=sh.breaks.length?`<rowBreaks count="${sh.breaks.length}" manualBreakCount="${sh.breaks.length}">${sh.breaks.map(b=>`<brk id="${b+1}" max="16383" man="1"/>`).join("")}</rowBreaks>`:"";
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheetPr><pageSetUpPr fitToPage="1"/></sheetPr><sheetViews><sheetView workbookViewId="0" showGridLines="0"/></sheetViews><sheetFormatPr defaultRowHeight="15"/>${cols}<sheetData>${rows}</sheetData>${merges}<pageMargins left="0.4" right="0.4" top="0.45" bottom="0.45" header="0.2" footer="0.2"/><pageSetup paperSize="9" orientation="${sh.land?"landscape":"portrait"}" fitToWidth="1" fitToHeight="0"/>${brks}</worksheet>`; });
  const files=[];
  files.push({name:"[Content_Types].xml",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")}</Types>`});
  files.push({name:"_rels/.rels",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`});
  files.push({name:"xl/workbook.xml",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${names.map((n,i)=>`<sheet name="${xesc(n)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join("")}</sheets></workbook>`});
  files.push({name:"xl/_rels/workbook.xml.rels",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join("")}<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`});
  files.push({name:"xl/styles.xml",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="${fonts.length}">${fonts.join("")}</fonts><fills count="${fills.length}">${fills.join("")}</fills><borders count="${borders.length}">${borders.join("")}</borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="${xfs.length}">${xfs.join("")}</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`});
  sheetXml.forEach((x,i)=>files.push({name:`xl/worksheets/sheet${i+1}.xml`,data:x}));
  return zipStore(files);
}
function exportReportXlsx(){
  const r=_R(); const root=$("#preview"); if(!root||!root.querySelector(".page table, .page .labels, .page .slips, .page .pkts")){ toast("Nothing to export"); return; }
  const sh=pagesToSheet(root,r[1].replace(/^\S+\s/,""));
  download(writeXlsxStyled([sh]),`${safeName(r[1].replace(/^\S+\s/,""))}_${safeName(S.setup.exam)}.xlsx`); toast("⬇ Excel file downloaded — edit it in Excel");
}
/* every main report in one workbook */
function exportAllXlsx(){
  const keep={rep:UI.rep,repPlan:UI.repPlan,repDay:UI.repDay,repRoom:UI.repRoom,repClass:UI.repClass};
  const box=document.createElement("div"); box.style.cssText="position:absolute;left:-30000px;top:0;width:1200px"; document.body.appendChild(box);
  const sheets=[]; const add=(id,name)=>{ UI.rep=id; box.innerHTML=renderReport(id); if(box.querySelector("table,.labels,.slips,.pkts")) sheets.push(pagesToSheet(box,name)); };
  try{
    UI.repRoom="ALL"; UI.repClass="ALL";
    PLAN.planList.forEach(k=>{ UI.repPlan=k; const sfx=PLAN.planList.length>1?" "+(PLAN.daily?"D"+(Number(k.slice(2))+1):PLAN.plans[k].label.split(" ")[0]):"";
      add("roomchart","Room charts"+sfx); add("roomwise","Room-wise"+sfx); add("classwise","Class-wise"+sfx); if(!PLAN.daily||PLAN.planList.length<=3) add("seatlist","Seat list"+sfx); });
    UI.repDay="ALL"; add("attendance","Attendance"); add("qp","Question papers"); add("absent","Absentees");
    add("invig","Invigilation"); add("roster","Duty roster"); add("datesheet","Date sheet");
  } finally { Object.assign(UI,keep); box.remove(); }
  if(!sheets.length){ toast("Nothing to export yet"); return; }
  download(writeXlsxStyled(sheets),`Seat_Plan_${safeName(S.setup.exam)}_${safeName(S.setup.session)}.xlsx`); toast(`⬇ Excel workbook with ${sheets.length} sheets downloaded`);
}

<script>
/* ---- app shell: menu drawer, install, offline cache ---- */
(function(){
  const b=document.body;
  document.getElementById("menuBtn").onclick=()=>b.classList.toggle("menu-open");
  document.getElementById("scrim").onclick=()=>b.classList.remove("menu-open");
  document.addEventListener("click",e=>{ if(e.target.closest("#side [data-nav]")) b.classList.remove("menu-open"); });
  let deferred=null; const ib=document.getElementById("installBtn");
  window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); deferred=e; ib.style.display="inline-flex"; });
  ib.onclick=async()=>{ if(!deferred) return; deferred.prompt(); await deferred.userChoice; deferred=null; ib.style.display="none"; };
  window.addEventListener("appinstalled",()=>{ ib.style.display="none"; toast("✔ SJS Seat Plan installed"); });
  if("serviceWorker" in navigator && location.protocol.startsWith("http")){
    navigator.serviceWorker.register("sw.js").then(reg=>{
      reg.addEventListener("updatefound",()=>{ const w=reg.installing; w&&w.addEventListener("statechange",()=>{ if(w.state==="installed"&&navigator.serviceWorker.controller) toast("⟳ New version ready — close and reopen the app"); }); });
    }).catch(()=>{});
  }
  // ask the browser to keep this app's data (not cleared when storage is low)
  if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
})();
</script>
